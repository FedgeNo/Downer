[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "downer"
version = "0.3.0"
description = "A desktop Markdown editor with local math rendering and live preview for Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["markdown-it-py>=4.1,<5", "mdit-py-plugins>=0.6,<0.7", "Pygments>=2.15,<3", "PyYAML>=6,<7"]

[project.scripts]
downer = "downer.main:main"

[tool.setuptools]
packages = ["downer"]

[tool.setuptools.package-data]
downer = ["assets/katex/*", "assets/katex/contrib/*", "assets/katex/fonts/*"]
